name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Counting, speed and config logic only need NumPy + PyYAML. The YOLO
      # stack (PyTorch) is a runtime dependency, so CI skips it to stay fast.
      - name: Install test dependencies
        run: pip install numpy pyyaml pytest ruff
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: pytest -q
